name: Apply Update 2 (one time)
on:
  push:
    branches: [Own-supabase]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: apply-update-2b
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if already applied
        id: gate
        run: |
          if [ -f .applied/update-2b ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "Update 2 is already applied. Nothing to do."; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Unpack the update
        if: steps.gate.outputs.run == 'yes'
        run: |
          base64 -d > update1.tgz <<'PAYLOAD'
          
          PAYLOAD
          tar xzf update1.tgz
          rm update1.tgz
          mkdir -p .applied
          echo "applied" > .applied/update-2b
          ls src/features
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'yes'
      - name: Install and build
        if: steps.gate.outputs.run == 'yes'
        run: |
          bun install
          bun run build
      - name: Save the update to your branch
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src public .applied
          git commit -m "Update 2: little lesson, need cards, repair, shared diary, appreciation jar, notifications"
          git push origin HEAD:Own-supabase
      - name: Wait for any other deploy to finish
        if: steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Deploy to Cloudflare" --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length' || echo 0)
            [ "$n" = "0" ] && break
            echo "Another deploy is running, waiting..."; sleep 15
          done
      - name: Publish
        if: steps.gate.outputs.run == 'yes'
        run: npx wrangler deploy --name our-little-world
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
