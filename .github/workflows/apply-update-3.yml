          BAA=
          PAYLOAD
          tar xzf update3.tgz
          rm update3.tgz
          mkdir -p .applied
          echo "applied" > .applied/update-3
          ls src/features
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'yes'
      - name: Install and build
        if: steps.gate.outputs.run == 'yes'
        run: |
          bun install
          bun run build
      - name: Save the update to your branch
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src public .applied
          git commit -m "Update 3: chat, floating bar, Home widgets, calm menus"
          git push origin HEAD:Own-supabase
      - name: Wait for any other deploy to finish
        if: steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Deploy to Cloudflare" --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length' || echo 0)
            [ "$n" = "0" ] && break
            echo "Another deploy is running, waiting..."; sleep 15
          done
      - name: Publish
        if: steps.gate.outputs.run == 'yes'
        run: npx wrangler deploy --name our-little-world
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
