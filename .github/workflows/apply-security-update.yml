      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'yes'
      - name: Install and build
        if: steps.gate.outputs.run == 'yes'
        run: |
          bun install
          bun run build
      - name: Known-vulnerability check on the packages
        if: steps.gate.outputs.run == 'yes'
        continue-on-error: true
        run: |
          {
            echo "## 2. Packages with known security holes (bun audit)"
            echo
            echo '```'
            bun audit 2>&1 | tail -60 || true
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the update to your branch
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A src public package.json bun.lock .applied
          git commit -m "Security hardening, private chat, new floating bar and Home widgets"
          git push origin HEAD:Own-supabase
      - name: Wait for any other deploy to finish
        if: steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Deploy to Cloudflare" --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length' || echo 0)
            [ "$n" = "0" ] && break
            echo "Another deploy is running, waiting..."; sleep 15
          done
      - name: Publish
        if: steps.gate.outputs.run == 'yes'
        run: npx wrangler deploy --name our-little-world
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Test the live site
        if: steps.gate.outputs.run == 'yes'
        run: |
          URL="https://our-little-world.unidentified110786.workers.dev"
          sleep 20
          fail=0
          check() { if [ "$2" = "pass" ]; then echo "| $1 | PASS |"; else echo "| $1 | **FAIL** |"; fail=1; fi; }
          {
            echo "## 3. Live site test"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            H=$(curl -sS -m 30 -D - -o /dev/null "$URL/login" | tr -d '\r')
            for hname in strict-transport-security content-security-policy x-content-type-options x-frame-options referrer-policy permissions-policy cross-origin-opener-policy; do
              if echo "$H" | grep -qi "^$hname:"; then check "Header $hname is sent" pass; else check "Header $hname is sent" fail; fi
            done
            if echo "$H" | grep -qi "^content-security-policy:.*frame-ancestors 'none'"; then check "Other sites cannot frame the app" pass; else check "Other sites cannot frame the app" fail; fi
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "http://our-little-world.unidentified110786.workers.dev/login" || echo 000)
            case "$code" in 301|302|307|308) check "Plain http is sent to https" pass;; *) check "Plain http is sent to https (got $code)" fail;; esac
            for path in /.env /.git/config /.git/HEAD /package.json /bun.lock /src/server.ts /supabase/config.toml /wrangler.toml /.dev.vars; do
              body=$(curl -sS -m 30 "$URL$path" || true)
              if echo "$body" | grep -qE 'SUPABASE|\[core\]|"dependencies"|lockfileVersion|export default'; then check "$path is NOT readable" fail; else check "$path is NOT readable" pass; fi
            done
            echo
            if [ "$fail" = "0" ]; then echo "**All live checks passed.**"; else echo "**Some checks failed. Send Claude a screenshot of this page.**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY" | tail -40
          [ "$fail" = "0" ]
