name: Apply Security Update (one time)
on:
  push:
    branches: [Own-supabase]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: apply-security
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if already applied
        id: gate
        run: |
          if [ -f .applied/security-1 ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "The security update is already applied. Nothing to do."; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Scan the whole Git history for leaked secrets
        if: steps.gate.outputs.run == 'yes'
        run: |
          {
            echo "## 1. Secret scan of the full Git history"
            echo
            hits=0
            for pattern in 'sb_secret_[A-Za-z0-9_-]{20,}' '-----BEGIN [A-Z ]*PRIVATE KEY-----' 'ghp_[A-Za-z0-9]{30,}' 'github_pat_[A-Za-z0-9_]{30,}' 'AKIA[0-9A-Z]{16}' 'service_role.{0,40}eyJ[A-Za-z0-9_-]{20,}' 'CLOUDFLARE_API_TOKEN[ ]*[:=][ ]*[A-Za-z0-9_-]{30,}' 'sk-[A-Za-z0-9]{32,}' 'SMTP_PASS[A-Za-z_]*[ ]*[:=][ ]*[^ ]{8,}'; do
              found=$(git rev-list --all | xargs -r -n 40 git grep -I -l -E "$pattern" 2>/dev/null | sed 's/^[^:]*://' | sort -u || true)
              if [ -n "$found" ]; then hits=1; echo "- FOUND pattern \`$pattern\` in files:"; echo "$found" | sed 's/^/    - /'; fi
            done
            # A JWT is only dangerous if it is the service_role one. The public (anon) key is meant to be public.
            for jwt in $(git rev-list --all | xargs -r -n 40 git grep -I -h -o -E 'eyJ[A-Za-z0-9_-]{15,}\.eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{10,}' 2>/dev/null | sort -u); do
              seg=$(echo "$jwt" | cut -d. -f2 | tr '_-' '/+'); while [ $(( ${#seg} % 4 )) -ne 0 ]; do seg="$seg="; done
              role=$(echo "$seg" | base64 -d 2>/dev/null | tr -d ' ' | grep -o '"role":"[a-z_]*"' || true)
              if echo "$role" | grep -q service_role; then hits=1; echo "- FOUND a service_role key in the history (starts with ${jwt:0:12}...)"; fi
            done
            if [ "$hits" = "0" ]; then echo "RESULT: OK. No private keys or secrets were found in any commit."; else echo; echo "RESULT: ACTION NEEDED. Replace the secret listed above in its dashboard (Supabase or Cloudflare), then tell Claude."; fi
            echo
            echo "Files named like secrets that exist in the current branch:"
            git ls-files | grep -iE '(^|/)(\.env($|\.)|.*\.pem$|.*\.key$|id_rsa|\.dev\.vars)' | sed 's/^/    - /' || true
            echo "(\`.env\` here holds only the PUBLIC Supabase address and public key, which are designed to be public.)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
